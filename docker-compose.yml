# =====================================================================
# SISTEMA DE AGENDA DOCENTE — UCP
# Orquesta: PostgreSQL + Backend Express + Frontend React (Nginx)
#
# PRIMER USO:   docker compose up --build -d
# USOS POSTERIORES: docker compose up -d
#
# Servicios expuestos en el host:
#   - Postgres   localhost:5432    (DBeaver)
#   - Backend    http://localhost:4000/api
#   - Frontend   http://localhost:5173
#
# Reinicializar BD desde cero:
#   docker compose down -v && docker compose up --build -d
# =====================================================================

services:

  # ─── Base de datos PostgreSQL ────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: agendadocente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234Ucp*}
      POSTGRES_DB: ${POSTGRES_DB:-agendadocentedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Script de inicialización (solo se ejecuta si la BD está vacía)
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-agendadocentedb}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ─── Backend Express + pg ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agendadocente-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # Importante: el "*" en la contraseña va URL-encoded como %2A
      DATABASE_URL: ${DATABASE_URL:-postgres://admin:1234Ucp%2A@db:5432/agendadocentedb}
      JWT_SECRET: ${JWT_SECRET:-UCP_JWT_Secret_2025_CambiarEnProduccion}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      # ── SMTP (recuperación de contraseña) ───────────────────────
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Agenda Docente UCP <no-reply@ucp.edu.co>}
      # ── Uploads ─────────────────────────────────────────────────
      UPLOADS_DIR: /var/app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    volumes:
      - uploads-data:/var/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Frontend React + Nginx ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: agendadocente-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
    name: agendadocente-db-data
  uploads-data:
    name: agendadocente-uploads
