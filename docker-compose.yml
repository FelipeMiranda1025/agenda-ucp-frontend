# =============================================
# Sistema de Agenda Docente — UCP
# Despliegue: PostgreSQL + Backend API + Frontend
# =============================================
#
# Estructura del repositorio:
#   /            → Frontend (React + Vite)
#   /backend     → API REST (Node.js + Express)
#
# Uso:
#   1. cp .env.example .env
#   2. Edita .env (al menos POSTGRES_PASSWORD y JWT_SECRET)
#   3. docker compose up -d
#
# Servicios expuestos:
#   - postgres  → localhost:5432
#   - backend   → http://localhost:3001/api
#   - frontend  → http://localhost:8080
#
# Reinicializar BD:
#   docker compose down -v && docker compose up -d

services:
  # ─── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ucp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agenda_ucp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agenda_ucp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend API ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ucp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agenda_ucp}
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-en-produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Frontend (React + Nginx) ─────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    container_name: ucp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
    name: ucp-pgdata
