# Render — frontend SPA (React Router)
# Si el servicio ya existe, añade en Dashboard → Redirects/Rewrites:
#   Source: /*  →  Destination: /index.html  →  Action: Rewrite

services:
  - type: web
    name: ucp-agenda-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
